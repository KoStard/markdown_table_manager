[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tea_catalog"
version = "0.1.0"
description = "Tea catalog management tool"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Tea Catalog Contributors" }
]
dependencies = [
    "pandas>=2.2.3",
]

[project.scripts]
import_teas = "tea_catalog.import_teas:main"
validate_json_schema = "tea_catalog.validate_json_schema:main"
[[tool.uv.index]]
url = "https://pypi.org/simple"